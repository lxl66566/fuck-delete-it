[package]
name          = "fuck-delete-it"
version       = "0.4.1"
edition       = "2024"
rust-version  = "1.85"
description   = "Force delete file/folder on Windows, kill occupying processes."
documentation = "https://github.com/lxl66566/fuck-delete-it"
repository    = "https://github.com/lxl66566/fuck-delete-it"
license       = "MIT"
keywords      = ["delete", "windows"]
categories    = ["filesystem"]

[[bin]]
name = "fdi"
path = "src/main.rs"

[dependencies]
anyhow  = "1"
clap    = { version = "4.6", features = ["derive"] }
inquire = "0.9"
winreg  = "0.56"

[dependencies.windows]
version  = "0.62"
features = [
  "Wdk_Storage_FileSystem",
  "Wdk_System_SystemInformation",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Threading",
]

[profile.release]
opt-level     = "s"
strip         = true
lto           = true
panic         = "abort"
codegen-units = 1
